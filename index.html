<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>此刻 · 中国与世界时间</title><meta name="description" content="输入中国时间，即时换算世界各地时间。准确处理夏令时与跨日。"><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="./"><span class="mark">◷</span> 此刻 <small>TIME, CONNECTED.</small></a><span class="tag">为跨越时区的每一次连接</span></header><main><div class="intro"><div class="eyebrow">CHINA TO THE WORLD</div><h1>同一个此刻，<br>世界的另一种时间。</h1><p>约会议、聊业务、联系远方的人。<br class="mobile">从中国时间出发，一眼找到当地时间。</p></div><section class="converter" aria-label="时区换算"><div class="input-side"><div class="section-label">出发时间 <span>中国 · 北京</span></div><div class="zone">UTC +08:00</div><label for="date">中国日期</label><input id="date" type="date"><label for="time">中国时间 · 24 小时制</label><input id="time" type="time" step="60"><div class="quick"><button id="now">使用当前时间</button><button data-hour="09:00">09:00</button><button data-hour="16:00">16:00</button><button data-hour="20:00">20:00</button></div><p class="hint">例如：下午四点，请输入 16:00。</p></div><div class="result-side"><div class="section-label">目的地时间 <span id="daydiff"></span></div><label for="country">国家 / 地区 · 城市</label><input id="search" type="search" placeholder="搜索国家、城市或时区，如：斯里兰卡、New York" aria-label="搜索国家或城市"><div class="select-wrap"><select id="country"></select></div><div id="offset" class="zone"></div><output id="result" aria-live="polite">--:--</output><div id="result-date"></div><div id="difference"></div><div class="actions"><button id="copy">复制换算结果</button><button id="share">分享此换算</button></div><p id="status" role="status"></p></div></section><section class="live"><div class="live-title"><h2>世界，此时此刻</h2><button id="add-clock" type="button">＋ 新增时钟</button></div><div id="clocks"></div><dialog id="clock-dialog" aria-labelledby="clock-dialog-title"><form method="dialog"><h3 id="clock-dialog-title"></h3><label for="clock-search">搜索国家、城市或时区</label><input id="clock-search" type="search" autocomplete="off"><label for="clock-zone">选择城市</label><select id="clock-zone" size="6"></select><p id="clock-feedback" role="status"></p><div class="clock-dialog-actions"><button id="remove-clock" type="button">移除此时钟</button><button value="cancel">取消</button><button id="save-clock" value="save">保存</button></div></form></dialog></section><footer><p>按所选日期自动应用当地夏令时规则。多时区国家请选具体城市。</p><p>时区规则来自浏览器内置数据库；请保持系统与浏览器更新。时间精度取决于设备时钟。</p></footer></main><script src="zones.js"></script><script src="app.js"></script><script src="clocks.js"></script></body></html>
